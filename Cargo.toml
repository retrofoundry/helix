[package]
name = "helix"
version = "0.1.0"
edition = "2021"

[lib]
name = "helix"
crate-type = ["lib", "staticlib"]

[features]
default = []

# Additional Features
speech = ["dep:tts"]
network = ["dep:tokio"]

[dependencies]
anyhow = "1.0.70"
env_logger = "0.10.0"
gilrs = { version = "0.10.2", features = ["serde", "serde-serialize"] }
winit = { version = "0.30", features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
libc = "0.2.139"
log = "0.4.17"
pollster = "0.3.0"
tokio = { version = "1.26.0", features = ["full"], optional = true }
tts = { version = "0.25.0", optional = true }
wgpu = { version = "29" }
spin_sleep = "1.1.1"
arie = "0.3.0"
fast3d = { git = "https://github.com/retrofoundry/fast3d-rs", default-features = false }
rustc-hash = "1.1.0"

# For local development, uncomment to build against local checkouts of fast3d and
# arie instead of the git/published crates.
# [patch."https://github.com/retrofoundry/fast3d-rs"]
# fast3d = { path = "/Users/dcvz/Github/fast3d-rs/fast3d" }
#
# [patch.crates-io]
# arie = { path = "/Users/dcvz/Github/arie" }

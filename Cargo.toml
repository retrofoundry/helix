[package]
name = "reality64"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/retrofoundry/reality64"
homepage = "https://retrofoundry.github.io/reality64/"

[lib]
name = "reality64"
crate-type = ["lib", "staticlib"]

[features]
default = []

# Additional Features
speech = ["dep:tts"]
network = ["dep:tokio"]

[dependencies]
anyhow = "1.0.70"
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.10.0"
gilrs = { version = "0.10.2", features = ["serde", "serde-serialize"] }
winit = { version = "0.30", features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
libc = "0.2.139"
log = "0.4.17"
pollster = "0.3.0"
tokio = { version = "1.26.0", features = ["full"], optional = true }
tts = { version = "0.25.0", optional = true }
wgpu = { version = "29" }
spin_sleep = "1.1.1"
arie = "0.3.0"
# Pinned: ultragfx may change its API between commits; bump this deliberately and fix up the render path with it.
ultragfx = { git = "https://github.com/retrofoundry/ultragfx", rev = "df60805", default-features = false, features = ["capture"] }
rustc-hash = "1.1.0"
sha2 = "0.10"

# For local development, uncomment to build against local checkouts of ultragfx and
# arie instead of the git/published crates.
# [patch."https://github.com/retrofoundry/ultragfx"]
# ultragfx = { path = "/Users/dcvz/Github/ultragfx/ultragfx" }
#
# [patch.crates-io]
# arie = { path = "/Users/dcvz/Github/arie" }

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.reality64]
opt-level = 1

[dev-dependencies]
serde_json = "1"
